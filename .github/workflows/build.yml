name: Build Desktop Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --name "FounderAI" --windowed --noconfirm --add-data "FounderFrameworks.txt:." --hidden-import="langchain" --hidden-import="chromadb" --hidden-import="llama_cpp" app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FounderAI-${{ runner.os }}
        path: dist/FounderAI*
