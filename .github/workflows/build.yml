name: Build Desktop Executables

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt


    - name: Build with PyInstaller
      run: |
        pyinstaller --name "FounderAI" --windowed --noconfirm --add-data "FounderFrameworks.txt:." --hidden-import="langchain" --hidden-import="chromadb" --hidden-import="llama_cpp" app.py

    - name: Compress MacOS App
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r FounderAI-macOS.zip FounderAI.app
        
    - name: Compress Windows App
      if: matrix.os == 'windows-latest'
      run: |
        cd dist
        Compress-Archive -Path FounderAI -DestinationPath FounderAI-Windows.zip

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        repository: ${{ secrets.RELEASE_REPO_TOKEN && 'vivekgreenitive-bit/founder-app-release' || github.repository }}
        token: ${{ secrets.RELEASE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        tag_name: latest
        name: Latest Release
        fail_on_unmatched_files: false
        files: |
          dist/*.zip
